# [general]
# import = [
#     "~/.config/alacritty/themes/themes/kanagawa_custom.toml"
# ]

# # Default colors
# [colors.primary]
# background = '#1d2021'
# foreground = '#d4be98'
#
# # Normal colors
# [colors.normal]
# black   = '#32302f'
# red     = '#cc241d'
# green   = '#98971a'
# yellow  = '#d79921'
# blue    = '#458588'
# magenta = '#b16286'
# cyan    = '#689d6a'
# white   = '#a89984'
#
# # Bright colors (same as normal colors)
# [colors.bright]
# black   = '#32302f'
# red     = '#fb4934'
# green   = '#b8bb26'
# yellow  = '#fabd2f'
# blue    = '#83a598'
# magenta = '#d3869b'
# cyan    = '#8ec07c'
# white   = '#ebdbb2'

[colors.primary]
background = '#181818'
# foreground = '#dcd7ba'
foreground = '#dbdbd9'

[colors.normal]
black   = '#090618'
red     = '#c34043'
green   = '#76946a'
yellow  = '#c0a36e'
blue    = '#7e9cd8'
magenta = '#957fb8'
cyan    = '#6a9589'
# white   = '#c8c093'
white   = '#cccccc'

[colors.bright]
black   = '#727169'
red     = '#e82424'
green   = '#98bb6c'
yellow  = '#e6c384'
blue    = '#7fb4ca'
magenta = '#938aa9'
cyan    = '#7aa89f'
# white   = '#dcd7ba'
white   = '#dbdbd9'

[colors.selection]
background = '#2d4f67'
foreground = '#c8c093'

[[colors.indexed_colors]]
index = 16
color = '#ffa066'

[[colors.indexed_colors]]
index = 17
color = '#ff5d62'

[cursor]
style = { shape = "Block", blinking = "Never" }
vi_mode_style = { shape = "Block", blinking = "Never" }

[font]
size = 10
normal = { family = "monospace", style = "Regular" }
bold = { family = "monospace", style = "Bold" }
italic = { family = "monospace", style = "Italic" }
bold_italic = { family = "monospace", style = "Bold Italic" }

[window]
# startup_mode = "Maximized"
# decorations = "None"
padding = { x = 2, y = 0 }
