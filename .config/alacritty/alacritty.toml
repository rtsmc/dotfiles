[general]
import = [
    "~/.config/alacritty/edge-dark.toml"
]

[cursor]
style = { shape = "Block", blinking = "Never" }
vi_mode_style = { shape = "Block", blinking = "Never" }

[font]
size = 11
normal = { family = "monospace", style = "Medium" }
bold = { family = "monospace", style = "Bold" }
italic = { family = "monospace", style = "Italic" }
bold_italic = { family = "monospace", style = "Bold Italic" }

[window]
padding = { x = 2, y = 0 }
